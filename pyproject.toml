[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-dinrail-picker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "mujoco>=3.3",
    "opencv-python-headless",
    "pyyaml",
    "pillow",
    "matplotlib",
    "ultralytics",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["sim", "perception"]
include = ["so101_sim*", "so101_perception*"]

[tool.pytest.ini_options]
testpaths = ["sim/tests", "perception/tests"]
